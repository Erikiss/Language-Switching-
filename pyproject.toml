[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lsne"
version = "0.1.0"
description = "Language Switching -> Non-Equilibrium: controlled language-switch experiments on State 2143 (Pythia)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "transformers>=4.45",
  "huggingface_hub>=0.24",
  "safetensors>=0.4",
  "tokenizers>=0.19",
  "scipy>=1.11",
  "pandas>=2.0",
  "opt_einsum>=3.3",
  "tqdm>=4.66",
  "requests>=2.31",
]

[project.optional-dependencies]
tnco = ["tnco @ git+https://github.com/google-research/tnco"]
notebooks = ["nbformat>=5.9", "matplotlib>=3.8", "jupyter", "pyarrow>=14"]
test = ["pytest>=7.4", "nbformat>=5.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lsne*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: tests that download models/SAEs (deselect with -m 'not slow')",
  "network: tests that need network access",
]
