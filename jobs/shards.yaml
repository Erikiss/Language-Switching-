# LS-NEQ compute plan: 6 shards for 6 A100s across two Colab accounts (DESIGN.md section 7).
#
# Every shard is one `python -m lsne.cli run ...` invocation.  Shards write their own
# run directories below `out` (Drive on Colab), never overlap, and are joined afterwards
# with `python -m lsne.cli merge --root <out> --out <out>/merged`.
#
# Conventions
#   * `--stage A,B,C,D,E,G,H,I,J,K,L` (not `all`) for the core arms: `all` would also run
#     stage F, which re-runs B/C/D over the State-2143 checkpoints that shards 1-2 cover
#     already.  Stages G-L (docs/STAGES.md): local geometry / trajectory, lambda
#     dynamics, domain compass + heads, RDX + Pile difficulty + sharing, test-time
#     training, cross-model transplant.  Stage K reads the client's DAO-fork corpus from
#     `data/ttt/dao_fork` (controls `data/ttt/neutral`, `data/ttt/nofork`; placeholder +
#     flag when absent), stage I the atlas extraction from `data/atlas` (optional), stage L
#     uses the rotated-self stand-in unless `--transplant-source model@rev` is given.
#   * Stage F partitions the (model, revision, family) triples deterministically with
#     `--shard-index/--shard-count`; shard 4 and shard 6 use it with count 1 (one GPU
#     each) - split them further by raising `--shard-count` if more GPUs become free.
#   * `--pairs trace` = the 27 dossier checkpoints (config.CHECKPOINT_TRACE) of pythia-160m;
#     `--f-stages B,D` runs only the baseline + non-equilibrium stages per checkpoint
#     (stage D with the reduced `limited` settings of lsne.experiments.common.Limits).
#   * Family subsets: every family of data/stimuli/families (F01-F20 + DEV01-DEV04 = 24
#     family ids, 96 formulations, 1152 variants + the original context) is included unless
#     `--families` is given.  The scale arm (shard 6) restricts the condition grid to the
#     C1 structure level (`--c-levels C1`: K=0, K=2/4/8 C1, K=16/28 seg = 6 variants per
#     formulation); `--limit-variants N` would instead keep whole formulations (core
#     triple first) and is meant for smoke / debugging runs.
#   * The anchor (cache/state2143) and the unigram counts (cache/unigram) are fetched by
#     range request on first use; set `LSNE_CACHE` to a Drive folder to share them.
#   * The SAE arm (shard 3) needs `--use-sae`; the published SAE for pythia-160m is
#     EleutherAI/sae-pythia-160m-32k (hookpoint layers.10 = block input 11).  FVU is
#     measured and recorded (certified only for FVU <= 0.4, DESIGN section 3).
#
# Estimated wall time per shard on one A100 (DESIGN section 7; only the old sequential
# stage C was measured, 3.05 h): 2-4 h for the stages A-E of shards 1-3 and 5 plus 1-2 h
# for G-L (stage H dominates: ~110k passes of the lambda paths, each now only the blocks
# from the injection layer on; stage J fetches 2 000 Pile sequences by range request,
# cached under LSNE_CACHE/pile_nll), shard 4: ~1-1.5 h per checkpoint with the full
# generation core (25-45 h), estimated 30-50 min per checkpoint (15-25 h) with the core
# capped at 24 formulations per (K, C) cell (Limits.gen_max_core, default when limited) -
# split it over 3-4 sessions with disjoint pairs; 3-6 h for shard 6, 1-2 h for shard 7
# (three checkpoints x TTT).  The first direction bank on an account also fetches the
# 2 000-sequence unigram counts (~3 min with 8 threads, cached under LSNE_CACHE/unigram).

version: 1
package: lsne
entry: python -m lsne.cli run
merge: python -m lsne.cli merge --root /content/drive/MyDrive/LSNE/runs --out /content/drive/MyDrive/LSNE/runs/merged

defaults:
  out: /content/drive/MyDrive/LSNE/runs
  dtype: float32
  device: auto
  seed: 0
  env:
    LSNE_CACHE: /content/drive/MyDrive/LSNE/cache
    HF_TOKEN: "<set in the Colab secrets; only needed for rate limits>"

shards:
  - id: 1
    account: colab-A
    gpu: A100-1
    purpose: core arm, State-2143 intervention checkpoint step98000, stages A-E and G-L
    model: EleutherAI/pythia-160m
    revision: step98000
    stages: [A, B, C, D, E, G, H, I, J, K, L]
    command: >-
      python -m lsne.cli run --stage A,B,C,D,E,G,H,I,J,K,L --model EleutherAI/pythia-160m --revision step98000
      --dtype float32 --device auto --out /content/drive/MyDrive/LSNE/runs --seed 0
      --ttt-corpus data/ttt/dao_fork --transplant-source EleutherAI/pythia-70m@step143000

  - id: 2
    account: colab-A
    gpu: A100-2
    purpose: core arm, State-2143 intervention checkpoint step99000, stages A-E and G-L
    model: EleutherAI/pythia-160m
    revision: step99000
    stages: [A, B, C, D, E, G, H, I, J, K, L]
    command: >-
      python -m lsne.cli run --stage A,B,C,D,E,G,H,I,J,K,L --model EleutherAI/pythia-160m --revision step99000
      --dtype float32 --device auto --out /content/drive/MyDrive/LSNE/runs --seed 0
      --ttt-corpus data/ttt/dao_fork --transplant-source EleutherAI/pythia-70m@step143000

  - id: 3
    account: colab-A
    gpu: A100-3
    purpose: SAE arm, final checkpoint step143000 with SAE feature directions (sae_D*/sae_E*), stages A-E and G-L (stages H/J/K use the SAE)
    model: EleutherAI/pythia-160m
    revision: step143000
    stages: [A, B, C, D, E, G, H, I, J, K, L]
    sae: EleutherAI/sae-pythia-160m-32k (layers.10)
    command: >-
      python -m lsne.cli run --stage A,B,C,D,E,G,H,I,J,K,L --model EleutherAI/pythia-160m --revision step143000
      --dtype float32 --device auto --out /content/drive/MyDrive/LSNE/runs --seed 0 --use-sae
      --ttt-corpus data/ttt/dao_fork --transplant-source EleutherAI/pythia-70m@step143000

  - id: 4
    account: colab-B
    gpu: A100-4
    purpose: checkpoint trace (27 dossier checkpoints 4k..143k), stages B and D (limited) per checkpoint
    model: EleutherAI/pythia-160m
    revisions: config.CHECKPOINT_TRACE
    stages: [F]
    f_stages: [B, D]
    shard_index: 0
    shard_count: 1
    command: >-
      python -m lsne.cli run --stage F --model EleutherAI/pythia-160m --revision step143000
      --dtype float32 --device auto --out /content/drive/MyDrive/LSNE/runs --seed 0
      --pairs trace --f-stages B,D --shard-index 0 --shard-count 1

  - id: 5
    account: colab-B
    gpu: A100-5
    purpose: scale arm, pythia-410m step143000 (SAE = MLP hookpoints only, not used here), stages A-E
    model: EleutherAI/pythia-410m
    revision: step143000
    stages: [A, B, C, D, E]
    command: >-
      python -m lsne.cli run --stage A,B,C,D,E --model EleutherAI/pythia-410m --revision step143000
      --dtype float32 --device auto --out /content/drive/MyDrive/LSNE/runs --seed 0

  - id: 6
    account: colab-B
    gpu: A100-6
    purpose: scale arm, pythia-1b and pythia-1.4b step143000, stages B/C/D (limited), C1 variants only
    models: [EleutherAI/pythia-1b, EleutherAI/pythia-1.4b]
    revision: step143000
    stages: [F]
    f_stages: [B, C, D]
    c_levels: [C1]
    shard_index: 0
    shard_count: 1
    command: >-
      python -m lsne.cli run --stage F --model EleutherAI/pythia-1b --revision step143000
      --dtype float32 --device auto --out /content/drive/MyDrive/LSNE/runs --seed 0
      --pairs EleutherAI/pythia-1b@step143000,EleutherAI/pythia-1.4b@step143000
      --f-stages B,C,D --c-levels C1 --shard-index 0 --shard-count 1

  - id: 7
    account: colab-B
    gpu: any free A100 (after shard 4 or 6)
    purpose: test-time training over the dossier checkpoints (memorisation speed at 4k / 98k / 143k, DESIGN 4.8d), stage K only
    model: EleutherAI/pythia-160m
    revision: step98000
    stages: [K]
    command: >-
      python -m lsne.cli run --stage K --model EleutherAI/pythia-160m --revision step98000
      --dtype float32 --device auto --out /content/drive/MyDrive/LSNE/runs_ttt --seed 0
      --ttt-corpus data/ttt/dao_fork --ttt-checkpoints step4000,step98000,step143000

# Smoke test of the whole pipeline on a CPU (same command the test suite runs; A-L in
# ~2 min unloaded on a 4-core box, < 10 min budget):
smoke:
  command: >-
    python -m lsne.cli run --stage all --model EleutherAI/pythia-14m --revision step98000
    --dtype float32 --device cpu --families DEV01 --out runs/smoke --smoke
